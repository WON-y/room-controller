[platformio]
default_envs = room

; 공통: Seeed XIAO ESP32S3 (Arduino core 2.x — Edge Impulse 라이브러리 호환성 때문에 고정)
[esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.14
    bblanchon/ArduinoJson@7.2.1
; XIAO 는 USB-C(네이티브 USB) 하나뿐 → USB CDC 로 시리얼 출력
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; [1단계] Edge Impulse 데이터 수집
[env:collect]
extends = esp32s3
build_src_filter = +<collect/>

; [2단계] 추론 + 서보 제어 + 서버 전송
[env:room]
extends = esp32s3
build_src_filter = +<infer/>

; 서보·조이스틱 없이 센서(DHT11, 사운드)만 연결해서 테스트
[env:room_sensors]
extends = env:room
build_flags = ${esp32s3.build_flags} -DNO_JOYSTICK

; DHT11 배선 진단
[env:dhttest]
extends = esp32s3
build_src_filter = +<dhttest/>

; PC 에서 RoomLogic 단위 테스트 (CI)
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
