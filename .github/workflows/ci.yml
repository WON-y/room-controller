name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 테스트 (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [services/comm, services/log, tools]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  firmware-test:
    name: 펌웨어 로직 단위테스트 (native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native          # RoomLogic: 다수결, 로그 시점, 서보 매핑, 규칙 분류

  firmware-build:
    name: 펌웨어 빌드 (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [room, room_sensors, collect, dhttest]
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-esp32-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
      - name: 펌웨어 크기 리포트
        run: pio run -e ${{ matrix.env }} -t size | tail -5 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware/.pio/build/${{ matrix.env }}/firmware.bin
          retention-days: 14

  docker:
    name: Docker 이미지 빌드 + 기동 확인
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's#^SUPABASE_URL=.*#SUPABASE_URL=#; s#^SUPABASE_KEY=.*#SUPABASE_KEY=#' .env
      - run: docker compose up -d --build
      - name: 대시보드 / telemetry → log 경로 스모크 테스트
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q "스마트 룸 컨트롤러"
          curl -sf -X POST localhost:8000/api/telemetry -H 'Content-Type: application/json' \
            -d '{"label":"calm","confidence":0.9,"temp":23,"hum":45,"sound_rate":0,"servo_angle":0,"model":"ci","report":"change"}'
          sleep 2
          curl -sf localhost:8000/api/events | tee /dev/stderr | grep -q '"model":"ci"'
      - if: failure()
        run: docker compose logs
      - run: docker compose down -v
